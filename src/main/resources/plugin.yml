name: WorldPluginManager
main: fr.phundir.wplmanager.WorldPluginManager
version: '${project.version}'
description: '${project.description}'
website: https://github.com/louis-potevin/WorldPluginManager
softdepend: [ProtocolLib]
# Ignored before 1.13; on 1.13+ it avoids Paper's slow legacy-plugin mode.
api-version: '1.13'
commands:
  wpm:
    description: Manages which plugins are enabled in each world.
    usage: /wpm help
    aliases: [worldpluginmanager, wplm]
  enpl:
    description: Legacy alias of /wpm enable.
    usage: /wpm enable <plugin> [world|*]
  displ:
    description: Legacy alias of /wpm disable.
    usage: /wpm disable <plugin> [world|*]
  focus:
    description: Legacy alias of /wpm focus.
    usage: /wpm focus <plugin> [world]
  flags:
    description: Legacy alias of /wpm status.
    usage: /wpm status [world] [plugin]
permissions:
  worldpluginmanager.*:
    description: Gives access to every /wpm command.
    default: op
    children:
      worldpluginmanager.enpl: true
      worldpluginmanager.displ: true
      worldpluginmanager.focus: true
      worldpluginmanager.flags: true
      worldpluginmanager.reset: true
      worldpluginmanager.reload: true
  worldpluginmanager.enpl:
    description: Allows /wpm enable.
    default: op
  worldpluginmanager.displ:
    description: Allows /wpm disable.
    default: op
  worldpluginmanager.focus:
    description: Allows /wpm focus.
    default: op
  worldpluginmanager.flags:
    description: Allows /wpm status and /wpm info.
    default: op
  worldpluginmanager.reset:
    description: Allows /wpm reset.
    default: op
  worldpluginmanager.reload:
    description: Allows /wpm reload.
    default: op
